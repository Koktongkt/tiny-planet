<!doctype html>
<html><head><meta charset="utf-8"><title>Journal (draft)</title>
<style>
@font-face{font-family:Fredoka;font-weight:400;src:url(../../public/fonts/fredoka-400.woff2)}
@font-face{font-family:Fredoka;font-weight:600;src:url(../../public/fonts/fredoka-600.woff2)}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#3a2a20}
#bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(8px) brightness(.8) saturate(1.05)}
/* the journal is authored in the art's own pixel space (1448x1086) and scaled to fit, like the Bag satchel */
.jb{position:absolute;left:50%;top:50%;width:1448px;height:1086px;transform:translate(-50%,-50%) scale(var(--s,.65));font-family:Fredoka,system-ui,sans-serif;color:#4a2a18}
.jb>img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 16px 22px rgba(20,8,2,.45));user-select:none}

/* ---- bookmarks: fabric ribbons standing up out of each page's top edge (art y 238), in front of the leather, never over the paper ---- */
/* two groups, one over each page, so nothing sits across the gutter between them */
.bm{position:absolute;inset:0;pointer-events:none}
.grp{position:absolute;top:140px;height:98px;display:flex;align-items:flex-end;justify-content:center;gap:8px;pointer-events:auto;filter:drop-shadow(0 4px 3px rgba(60,24,6,.38)) drop-shadow(0 1px 1px rgba(60,24,6,.3))}
.grp.l{left:160px;width:492px} /* page top edge is flat (y 238) from x 160 to ~655, then curls down into the gutter */
.grp.r{left:796px;width:466px} /* flat again from ~795 */
.bk{position:relative;flex:none;height:70px;border:0;padding:6px 17px 0;cursor:pointer;font:600 26px Fredoka,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;gap:9px;color:#fff;text-shadow:0 1.5px 1px rgba(60,20,10,.35);
  /* swallowtail cut at the top, like the ribbons painted at the bottom of the book */
  clip-path:polygon(0 0,calc(50% - 18px) 0,50% 11px,calc(50% + 18px) 0,100% 0,100% 100%,0 100%);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px),linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:inset 5px 0 0 rgba(255,255,255,.16),inset -5px 0 0 rgba(0,0,0,.12),inset 0 -5px 4px -3px rgba(60,20,5,.3);
  transition:height .16s ease,filter .16s}
.bk::before{content:'';position:absolute;inset:0 11px;border-left:2px dashed rgba(255,255,255,.45);border-right:2px dashed rgba(255,255,255,.45);pointer-events:none}
.bk:not(.on){filter:saturate(.92) brightness(.96)}
.bk svg{width:32px;height:32px;flex:none}
.bk .n{min-width:30px;height:28px;padding:0 8px;border-radius:14px;display:grid;place-items:center;font-size:19px;color:#fff;background:rgba(40,12,4,.25);text-shadow:none}
.bk .dot{position:absolute;right:7px;top:14px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffc23a);box-shadow:0 0 0 2px rgba(120,40,10,.55),0 0 8px #ffe08a}
.bk:hover{height:77px;filter:none}
.bk:focus-visible{outline:none;filter:none;text-decoration:underline 3px}
/* the open bookmark is pulled up out of the pages: taller, full colour, a little sheen */
.bk.on{height:90px;filter:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 40%),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px),linear-gradient(180deg,var(--c1),var(--c2))}
.rv{display:none}

/* ---- sub-pages: small paper tabs along the top of the left page ---- */
.sub{position:absolute;left:204px;top:270px;width:486px;display:flex;justify-content:center;gap:6px}
.st{height:48px;padding:0 12px;border:0;border-radius:12px;cursor:pointer;font:600 21px Fredoka,system-ui,sans-serif;color:#5a3a22;display:flex;align-items:center;gap:8px;
  background:color-mix(in srgb,var(--c) 30%,#fbe9cf);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c) 45%,transparent),0 2px 3px rgba(110,60,20,.18)}
.st small{font-size:16px;font-weight:400;opacity:.75}
.st i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.st.on{background:var(--c);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 3px 6px rgba(110,60,20,.3)}
.st.on i{background:#fff}.st.on small{opacity:.9}

/* ---- pages: list on the left, the picked entry on the right ---- */
.L{position:absolute;left:204px;top:276px;width:486px;height:636px;display:flex;flex-direction:column}
body.hassub .L{top:332px;height:580px}
.R{position:absolute;left:786px;top:268px;width:478px;height:650px;display:flex;flex-direction:column;align-items:center;text-align:center}
.scroll{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#d4a878 transparent;padding:4px 6px 6px;margin:0 -6px}
.it{display:inline-grid;place-items:center}.it svg{width:100%;height:100%}
.ph{font-size:34px;font-weight:600;color:#5a321c;margin:0 0 10px;text-align:center}
.ph small{font-size:20px;font-weight:400;color:#9a6a44;margin-left:6px}
.lfoot{margin-top:8px;text-align:center;font-size:19px;color:#7a5236}
.bar{height:14px;border-radius:7px;background:#8a5a3c;box-shadow:inset 0 2px 2px rgba(40,10,0,.35);overflow:hidden;margin:6px 40px 0}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#a5d65c,#6fae34);border-radius:7px}
.pill{height:32px;padding:0 13px;border-radius:16px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.active{background:#f8cf62;color:#5a3a10}.pill.avail{background:#ead7bb;color:#6a4a2e}.pill.done{background:#cfe3b4;color:#3f6a22}
.empty{color:#a07a58;font-size:19px;padding:10px}
.btn{height:60px;padding:0 26px;border:0;border-radius:22px;font:600 24px Fredoka,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.btn.g{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);background:linear-gradient(180deg,#8ccd5a,#4e9530);box-shadow:0 0 0 2px #36701e,0 4px 0 #36701e,inset 0 2px 0 rgba(255,255,255,.4)}
.btn.y{color:#4a2c0e;background:linear-gradient(180deg,#ffe49a,#f2b640);box-shadow:0 0 0 2px #b8822c,0 4px 0 #b8822c,inset 0 2px 0 rgba(255,255,255,.6)}
.btn[disabled]{filter:grayscale(.7) opacity(.6);cursor:default}
.hint{font-size:17px;color:#9a6a44;margin-top:10px}
.blob{position:relative;width:190px;height:150px;display:grid;place-items:center;flex:none}
.blob::before{content:'';position:absolute;inset:6px 14px;background:#f1d8ae;border-radius:46% 54% 44% 56%/56% 44% 56% 44%}
.blob>*{position:relative}.blob .it{width:132px;height:132px}
.blob.sm{height:118px;width:150px}
.rt{font-size:36px;font-weight:600;color:#4a2a18;margin:4px 0 2px;display:flex;align-items:center;gap:10px;justify-content:center}
.rsub{font-size:19px;color:#8a5a36;margin-bottom:8px}
.rdesc{font-size:20px;line-height:1.35;color:#5a3a24;margin:4px 10px 10px}
.rule{width:70%;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#f2c26a,transparent);margin:2px auto 10px}
.box{width:100%;box-sizing:border-box;border:2.5px dashed rgba(180,120,70,.4);border-radius:18px;padding:12px 14px 10px;margin-top:6px;text-align:left;position:relative}
.box>b.lab{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:#f9dcae;color:#5a3a1a;border-radius:14px;padding:2px 16px;font-size:19px;box-shadow:0 2px 0 #e0b47a}
.row{display:flex;align-items:center;gap:10px;font-size:20px;padding:5px 2px;color:#4a2a18}
.row .it{width:34px;height:34px;flex:none}
.row .c{margin-left:auto;font-weight:600;color:#8a5a36}
.row.ok .c{color:#4f8f2a}
.chk{width:26px;height:26px;border-radius:7px;border:2.5px solid #c49a6c;flex:none;display:grid;place-items:center;background:#fff8ec}
.row.ok .chk{background:#6fb03a;border-color:#4a8a22}.row.ok .chk::after{content:'';width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.row.ok .t{text-decoration:line-through;color:#8a7a68}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:19px;text-align:left}
.facts dt{color:#9a6a44}.facts dd{margin:0;color:#4a2a18;font-weight:600}

/* quests */
.qc{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;margin-bottom:10px;cursor:pointer;background:#fbe8cc;box-shadow:0 3px 0 #e6c597,0 4px 8px rgba(120,70,20,.12);border:0;width:100%;text-align:left;font-family:inherit;color:inherit}
.qc.on{background:#fff3d6;box-shadow:0 0 0 4px #f5c242,0 0 18px rgba(255,200,80,.55)}
.qc.done{opacity:.6}
.qc .ic{width:62px;height:62px;flex:none;display:grid;place-items:center}
.qc .ic .it{width:58px;height:58px}
.qc b{display:block;font-size:22px}.qc span.d{display:block;font-size:17px;color:#7a5236;line-height:1.25}
.qc .pill{margin-left:auto}
.qh{font-size:17px;font-weight:600;color:#a07a58;letter-spacing:.5px;margin:4px 4px 8px;text-transform:uppercase}
/* people */
.med{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 60% 72%),hsl(var(--h) 45% 52%));box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 3px #fff4e0,0 2px 4px rgba(90,50,20,.3);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pc{border:0;background:#fbe8cc;border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:inherit;color:inherit;box-shadow:0 3px 0 #e6c597}
.pc .med{width:52px;height:52px;font-size:24px}
.pc b{font-size:15px;line-height:1.1;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc.on{background:#fff3d6;box-shadow:0 0 0 4px #f5c242,0 0 14px rgba(255,200,80,.5)}
.pc.unmet .med{background:#d9c3a3;color:#f6ead8;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.pc.unmet b{color:#b09070}
.hearts{display:inline-flex;gap:2px}.hearts svg{display:block}
.shelf{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:19px}
.shelf>span:first-child{width:92px;color:#8a5a36;font-weight:600}
.shelf .it{width:42px;height:42px;background:#fff6e6;border-radius:12px;box-shadow:0 2px 0 #e6c597}
.shelf .q{width:42px;height:42px;border-radius:12px;border:2.5px dashed rgba(180,120,70,.45);display:grid;place-items:center;color:#c0946a;font-weight:600;box-sizing:border-box}
/* recipes */
.rc{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:14px;padding:3px 10px;cursor:pointer;font-family:inherit;color:inherit;text-align:left;border-bottom:2px dashed rgba(180,120,70,.25)}
.rc .it{width:46px;height:46px;flex:none}
.rc b{font-size:20px}.rc small{display:block;font-size:16px;color:#9a6a44}
.rc .rdy{margin-left:auto;width:16px;height:16px;border-radius:50%;background:#7cc04a;box-shadow:0 0 0 3px #d8f0c0}
.rc .own{margin-left:auto}
.rc.on{background:#fff3d6;box-shadow:0 0 0 3px #f5c242}
.rc.lock{color:#a88a6a}
.rc.lock .it{filter:brightness(0) opacity(.18)}
.pf{color:#e59a1e;font-size:18px}
/* discoveries */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dc{position:relative;border:0;background:#fbe8cc;border-radius:16px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-family:inherit;color:inherit;box-shadow:0 3px 0 #e6c597}
.dc .it{width:64px;height:64px}
.dc b{font-size:15px;line-height:1.15;min-height:34px;display:flex;align-items:center;text-align:center}
.dc.no .it{filter:brightness(0) opacity(.16)}.dc.no b{color:#b09070}
.dc.on{background:#fff3d6;box-shadow:0 0 0 4px #f5c242,0 0 14px rgba(255,200,80,.5)}
.stamp{position:absolute;right:-4px;top:4px;transform:rotate(12deg);font-size:12px;font-weight:600;color:#b8452e;border:2px solid #b8452e;border-radius:6px;padding:0 4px;background:#fff3e6;letter-spacing:.5px}
.bigstamp{display:inline-block;transform:rotate(-6deg);font-size:20px;font-weight:600;color:#b8452e;border:3px solid #b8452e;border-radius:10px;padding:2px 12px;margin-top:12px}
/* memories */
.pol{position:relative;background:#fffdf7;padding:8px 8px 26px;box-shadow:0 3px 8px rgba(90,50,20,.25);transform:rotate(var(--r));border:0;cursor:pointer;font-family:inherit}
.pol img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.pol span{position:absolute;left:0;right:0;bottom:4px;font-size:15px;color:#7a5236}
.pol::before{content:'';position:absolute;left:50%;top:-10px;width:60px;height:20px;margin-left:-30px;background:rgba(240,200,140,.75);transform:rotate(-3deg)}
.pol.on{box-shadow:0 0 0 4px #f5c242,0 4px 14px rgba(200,140,40,.5)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 16px;padding:12px 6px}
.slot{aspect-ratio:1/1.02;border:2.5px dashed rgba(180,120,70,.4);border-radius:6px}
.bigpol{width:400px;padding:12px 12px 46px;transform:rotate(-1.5deg);cursor:default}
.bigpol span{font-size:22px;bottom:10px}
.diary{font-size:20px;line-height:1.3;text-align:left;width:100%}
.diary .dd{font-weight:600;color:#b4712e;font-size:18px;margin:12px 0 4px;border-bottom:2px dashed rgba(180,120,70,.3)}
.diary p{margin:4px 0;display:flex;gap:10px;align-items:center}.diary .it{width:34px;height:34px;flex:none}
.hot{position:absolute;border:0;background:none;cursor:pointer;border-radius:50%}
.hot:hover{background:rgba(255,240,200,.15)}
body.debug .hot,body.debug .bm{outline:3px dashed #39f;outline-offset:2px}
</style></head>
<body>
<img id="bg" src="../bg-in.jpg" alt="">
<span id="defs"></span>
<div class="jb" id="jb" role="dialog" aria-label="Journal">
  <img src="ref3/journal-frame.webp" srcset="ref3/journal-frame.webp 1x, ref3/journal-frame@2x.webp 2x" alt="" draggable="false">
  <nav class="bm" id="bm" role="tablist" aria-label="Journal sections"></nav>
  <div id="sub" class="sub" role="tablist" aria-label="Pages in this section"></div>
  <div class="L" id="pl"></div>
  <div class="R" id="pr"></div>
  <button class="hot" style="left:1284px;top:104px;width:90px;height:90px" aria-label="Close journal"></button>
</div>
<script src="../icons.js"></script><script src="journal-data.js"></script>
<script>
const I = {
  quests: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a2 2 0 0 1 2 2v13"/><path d="M6 3a2 2 0 0 0-2 2v1h4"/><path d="M8 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-1h-9v1a2 2 0 0 1-2 2"/><path d="M11 8h5M11 12h5"/></svg>',

// sample numbers, as the live game would fill them in
const BOOKMARKS = [
  { id: 'quests', side: 'l', c: ['#e2654c', '#b8402e'], label: 'Quests', dot: true },
  { id: 'people', side: 'l', c: ['#f3c25a', '#d4922a'], label: 'People' },
  { id: 'recipes', side: 'l', c: ['#7ab4cf', '#4f89a8'], label: 'Recipes', dot: true },
  { id: 'discoveries', side: 'r', c: ['#9cc75c', '#679a34'], label: 'Discoveries' },
  { id: 'memories', side: 'r', c: ['#ea9a92', '#c86a66'], label: 'Memories' },
]
// ---------- a sample save on day 8, shaped like G.s (with the three agreed additions: metDay, learned, errands.log) ----------
const S = {
  day: 7,
  inv: { wood: 6, reed: 2, stone: 3, clay: 2, shell: 1, driftwood: 1, rice: 3, fish: 2, berries: 4, flower: 3, moss: 2, glowmoss: 1, bamboo: 2, fluff: 2, wool: 1, crystal: 1, shard: 2, coin: 3, firefly: 1, mushroom: 2, herbs: 1, acorn: 2 },

  tutorial: { done: { move: 1, look: 1, gather: 1, craft: 1, talk: 1 } },
  friends: { list: {

    fisherman: { hearts: 2, metDay: 1, learned: { onigiri: 'love', driftwood: 'like' } },
    fishwife: { hearts: 2.5, metDay: 1, learned: { grilledfish: 'love', shell: 'like' } },
    'dock boy': { hearts: 1, metDay: 2, learned: { coin: 'like' } },
    'sailor girl': { hearts: 1.5, metDay: 3, learned: { chime: 'like' } },
    baker: { hearts: 2, metDay: 3, learned: { berries: 'love' } },
    scholar: { hearts: 3, metDay: 4, learned: { shard: 'love', coin: 'like', fish: 'dislike' }, hit: { 3: 6 } },
    'farm wife': { hearts: 0.5, metDay: 5, learned: {} },
    farmer: { hearts: 0.25, metDay: 6, learned: { rice: 'love' } },
  } },
  errands: { list: [
    { id: 'e7-1', npcId: 'fishwife', wants: [{ itemId: 'shell', count: 2 }, { itemId: 'driftwood', count: 1 }], reward: { coins: 4, hearts: 1 }, accepted: true, done: false },
    { id: 'e7-2', npcId: 'dock boy', wants: [{ itemId: 'stone', count: 3 }], reward: { coins: 3 }, accepted: false, done: false },
    { id: 'e7-3', npcId: 'farm wife', wants: [{ itemId: 'flower', count: 2 }], reward: { itemId: 'seedpack' }, accepted: false, done: false },
  ], log: [
    { npcId: 'fisherman', wants: [{ itemId: 'reed', count: 3 }], reward: { coins: 3 }, day: 6 },
    { npcId: 'baker', wants: [{ itemId: 'berries', count: 4 }], reward: { coins: 2, hearts: 1 }, day: 5 },
  ] },
  fish: { minnow: { count: 6, best: 8, firstDay: 1 }, crucian: { count: 3, best: 22, firstDay: 2 }, ayu: { count: 2, best: 19, firstDay: 3 }, mackerel: { count: 4, best: 31, firstDay: 4 }, koi: { count: 1, best: 41, firstDay: 5 }, loach: { count: 1, best: 12, firstDay: 6 }, sea_bream: { count: 1, best: 38, firstDay: 6 } },

    relics: { coin: { count: 5, firstDay: 1 }, shard: { count: 4, firstDay: 2 }, crystal: { count: 1, firstDay: 4 }, relic_bell: { count: 1, firstDay: 5 } },
    perfect: { onigiri_perfect: 5, teacup_perfect: 6 } },
  museum: { donated: { shard: 3, koi: 6, relic_bell: 6 } },
  photos: [ { day: 1, src: '../bg-out.jpg', pos: '30% 40%', note: 'First morning on the planet' }, { day: 2, src: 'globe-day.jpg', pos: '50% 50%', note: 'The whole planet from the hill' },
    { day: 4, src: '../bg-in.jpg', pos: '60% 50%', note: 'Home, a little tidier' }, { day: 5, src: 't-out2.jpg', pos: '40% 60%', note: 'Koi day!' }, { day: 6, src: 'globe-night.jpg', pos: '50% 50%', note: 'Fireflies over the terraces' } ],

function questList() {

  const waiting = S.errands.list.filter(e => !e.accepted && !e.done).length

}

// ---------- Memories ----------
function firsts() {
  const ev = []
  for (const [k, f] of Object.entries(S.friends.list)) { if (f.metDay != null) ev.push([f.metDay, k, `Met <b>${P[k].name}</b>`, 'med']); for (const [h, d] of Object.entries(f.hit || {})) ev.push([d, k, `<b>${P[k].name}</b> reached ${h} hearts`, 'heart']) }
  for (const [id, e] of Object.entries(S.fish)) ev.push([e.firstDay, id, `Caught your first <b>${nm(id)}</b>`])
  for (const [id, e] of Object.entries(S.journal.forage)) ev.push([e.firstDay, id, `Found <b>${nm(id)}</b>`])
  for (const [id, e] of Object.entries(S.journal.relics)) ev.push([e.firstDay, id, `Dug up <b>${nm(id)}</b>`])
  for (const [id, d] of Object.entries(S.museum.donated)) ev.push([d, id, `Gave <b>${nm(id)}</b> to the museum`])
  for (const [id, d] of Object.entries(S.journal.perfect)) ev.push([d, id.replace('_perfect', ''), `Cooked a perfect <b>${nm(id.replace('_perfect', ''))}</b>`])
  for (const e of S.errands.log) ev.push([e.day, e.npcId, `Did a favour for <b>${P[e.npcId].name}</b>`, 'med'])
  return ev.sort((a, b) => a[0] - b[0])
}
function diary(ev) { let d = -1; return `<div class="diary">${ev.map(([day, id, t, k]) => (day !== d ? `<div class="dd">${D((d = day))}</div>` : '') + `<p>${k === 'med' ? med(id, 34, 16) : k === 'heart' ? heart1(32) : icon(id, 34)}<span>${t}</span></p>`).join('')}</div>` }
function memories() {
  if (subOf.memories === 'firsts') { const ev = firsts(), lines = (n) => n + new Set(ev.slice(0, n).map(e => e[0])).size // a day heading takes a line too
    // split at the day boundary nearest 45% of the lines (the left page is shorter: the sub-tabs sit on it)
    const cuts = ev.map((e, i) => i).filter(i => i > 0 && ev[i][0] !== ev[i - 1][0]), goal = lines(ev.length) * 0.45
    const at = cuts.reduce((b, i) => Math.abs(lines(i) - goal) < Math.abs(lines(b) - goal) ? i : b, cuts[0] || ev.length)
    return [`<div class="scroll">${diary(ev.slice(0, at))}</div>`, `<div class="scroll" style="width:100%">${diary(ev.slice(at))}</div><div class="hint">Her journal fills in by itself as the days go by.</div>`] }

  return [L, R]

const PAGES = { quests, people, recipes, discoveries, memories }
function render() {
  document.getElementById('bm').innerHTML = ['l', 'r'].map(side => `<div class="grp ${side}">${BOOKMARKS.filter(b => b.side === side).map(bk).join('')}</div>`).join('')
  const subs = SUBS[tab]; document.body.classList.toggle('hassub', !!subs)
  document.getElementById('sub').innerHTML = subs ? subs.map(s => `<button class="st${s.id === subOf[tab] ? ' on' : ''}" style="--c:${s.c}" role="tab" aria-selected="${s.id === subOf[tab]}" data-sub="${s.id}"><i></i>${s.label}${s.of ? `<small>${s.seen}/${s.of}</small>` : ''}</button>`).join('') : ''
  const [L, R] = PAGES[tab](); document.getElementById('pl').innerHTML = L; document.getElementById('pr').innerHTML = R
}
document.getElementById('bm').onclick = e => { const b = e.target.closest('[data-id]'); if (b) { tab = b.dataset.id; render() } }
document.getElementById('sub').onclick = e => { const b = e.target.closest('[data-sub]'); if (b) { subOf[tab] = b.dataset.sub; render() } }
document.getElementById('pl').onclick = e => { const b = e.target.closest('[data-pick]'); if (!b) return; const v = b.dataset.pick
  if (tab === 'recipes' || tab === 'discoveries') pick[tab][subOf[tab]] = v; else if (tab === 'memories') pick.memories = +v; else pick[tab] = v; render() }
addEventListener('keydown', e => { const i = BOOKMARKS.findIndex(b => b.id === tab), n = BOOKMARKS.length
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { tab = BOOKMARKS[(i + (e.key === 'ArrowRight' ? 1 : n - 1)) % n].id; render() } })
const fit = () => document.getElementById('jb').style.setProperty('--s', Math.min(1, (innerWidth - 16) / 1448, (innerHeight - 16) / 1086))
document.getElementById('defs').innerHTML = IC.defs
addEventListener('resize', fit); fit(); render()
</script>
</body></html>
