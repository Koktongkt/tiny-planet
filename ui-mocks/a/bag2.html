<!doctype html>
<html><head><meta charset="utf-8"><title>Adventurer's Satchel</title>
<link rel="stylesheet" href="glass.css">
<script src="../icons.js"></script><script src="glyphs.js"></script>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#3a2a20}#root{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(7px) brightness(.8) saturate(1.1)}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(40,24,14,.05),rgba(30,18,10,.5))}
.abs{position:absolute}
svg.layer{position:absolute;inset:0;width:1280px;height:720px;overflow:visible}
/* cream leather-craft content */
.sat{--ink:#4a3020;--cream:#fbf1dc;--cream2:#f1e0bd;--lth:#6a3e22;color:var(--ink);text-shadow:none}
.title{left:640px;top:142px;transform:translate(-50%,-50%);height:54px;padding:0 30px 0 14px;border-radius:27px;display:flex;align-items:center;gap:10px;font-size:28px;font-weight:600;color:#4a2e18;
  background:linear-gradient(180deg,#fffaf0,#f0dfbc);box-shadow:0 0 0 2px #b88a52,0 0 0 4px rgba(80,44,20,.35),0 4px 10px rgba(0,0,0,.35),inset 0 -3px 0 rgba(160,110,60,.2)}
.title .it{width:40px;height:40px}
.sprig{position:absolute;top:50%;width:46px;height:34px;margin-top:-17px}
.xb{left:1014px;top:142px;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#fffaf0,#ead8b4);box-shadow:0 0 0 2px #8a5a30,0 3px 6px rgba(0,0,0,.4)}
.xb svg{width:22px;height:22px}
.tabs2{left:232px;top:212px;display:flex;gap:8px}
.tb{position:relative;height:38px;padding:0 14px 0 10px;border-radius:19px;display:flex;align-items:center;gap:7px;font-size:16px;font-weight:600;color:#f6e6c8;
  background:linear-gradient(180deg,#6e4428,#53311c);box-shadow:inset 0 1px 0 rgba(255,220,170,.25),0 2px 3px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25)}
.tb i{font-style:normal;font-size:14px;font-weight:500;opacity:.75}
.tb svg{width:22px;height:22px}
.tb.on{color:#4a2e14;background:linear-gradient(180deg,#ffe9a8,#f0c060);box-shadow:0 0 0 1.5px #a8742c,0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 #fffbe8}
.tb.on::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top:10px solid #f0c060}
.grid{left:222px;top:262px;width:566px;height:328px;border-radius:18px;padding:12px 26px;display:grid;grid-template-columns:repeat(5,92px);grid-auto-rows:92px;gap:13px 14px;
  background:linear-gradient(180deg,#f7ead0,#efdcb8);box-shadow:inset 0 0 0 2px rgba(120,80,40,.25),inset 0 6px 14px rgba(90,50,20,.18),0 1px 0 rgba(255,230,190,.35)}
.c{position:relative;border-radius:16px;display:grid;place-items:center;background:linear-gradient(180deg,#fffcf4,#f6ead2);
  box-shadow:0 3px 0 #dcc49a,0 4px 8px rgba(90,50,20,.18),inset 0 1px 0 #fff}
.c .it{width:66px;height:66px;margin-top:-4px}
.c .it svg{filter:drop-shadow(0 2px 1.5px rgba(90,50,20,.25))}
.c .n{position:absolute;right:9px;bottom:4px;font-size:19px;font-weight:700;color:#3a2618}
.c.sel{background:linear-gradient(180deg,#fffaea,#fbeccb);box-shadow:0 0 0 3px #f2c24e,0 0 0 5px rgba(242,194,78,.35),0 0 16px rgba(255,200,90,.55),inset 0 1px 0 #fff}
.c .st{position:absolute;left:9px;top:5px;color:#f0b030;font-size:15px}
.c.e{background:none;box-shadow:none;border:2px dashed rgba(150,110,60,.4)}
.card{left:798px;top:206px;width:286px;height:386px;border-radius:20px;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='2' seed='9'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),linear-gradient(180deg,#fffaf0,#f4e6c8);
  box-shadow:0 0 0 2px #c49a62,0 6px 16px rgba(40,20,8,.4),inset 0 0 0 1px #fff}
.card::before{content:'';position:absolute;inset:8px;border-radius:14px;border:1.8px dashed rgba(160,110,60,.45);pointer-events:none}
.card .blob{width:150px;height:126px;display:grid;place-items:center;position:relative}
.card .blob::before{content:'';position:absolute;inset:6px 10px;background:#f0dcb4;border-radius:46% 54% 42% 58%/55% 45% 55% 45%;opacity:.9}
.card .blob .it{position:relative;width:118px;height:118px}
.card .blob .sh{position:absolute;left:8px;top:16px;width:30px;height:30px}
.card h5{font-size:26px;font-weight:700;margin:2px 0 6px;color:#3a2618}
.card .pil{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:13px;font-size:13px;font-weight:700;letter-spacing:.8px;color:#6a4418;background:#fbe3a0;box-shadow:inset 0 0 0 1px #e8c070}
.card .pil b{color:#e8902a}
.card p{font-size:15px;line-height:1.45;color:#5a4030;margin:12px 0 0}
.card .ln{width:100%;border-top:1.6px dashed rgba(160,110,60,.4);margin:auto 0 12px}
.card .acts{display:flex;gap:8px;width:100%}
.bt{flex:1;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:17px;font-weight:700}
.bt svg{width:22px;height:22px}
.bt.g{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);background:linear-gradient(180deg,#8fd060,#4f9a32);box-shadow:0 0 0 1.5px #2f6a1c,0 3px 0 #2f6a1c,inset 0 2px 0 rgba(255,255,255,.4)}
.bt.y{color:#5a3410;background:linear-gradient(180deg,#ffe7a0,#f0b844);box-shadow:0 0 0 1.5px #a8742c,0 3px 0 #a8742c,inset 0 2px 0 rgba(255,255,255,.6)}
.foot{left:238px;top:598px;width:822px;height:44px;border-radius:22px;display:flex;align-items:center;gap:12px;padding:0 10px 0 22px;font-size:16px;font-weight:500;color:#f6e6c8;
  background:linear-gradient(180deg,#4e2e1a,#5e3a22);box-shadow:inset 0 3px 6px rgba(0,0,0,.45),0 1px 0 rgba(255,220,170,.25)}
.foot svg{width:22px;height:22px}
.foot .m{width:240px;height:9px;border-radius:5px;background:#2e1a0e;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.foot .m i{display:block;width:24%;height:100%;background:linear-gradient(90deg,#f0b844,#ffe7a0);border-radius:5px}
.foot .rs{margin-left:auto;height:32px;padding:0 16px 0 12px;border-radius:16px;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:#f6e6c8;box-shadow:inset 0 0 0 1.5px rgba(246,230,200,.55)}
.foot .rs svg{width:18px;height:18px}
</style></head>
<body class="ui"><img id="bg" src="../bg-in.jpg"><div class="veil"></div>

<script>

    <path d="M14 9c-8-1-11-6-10-8 5-1 10 2 10 8z" fill="#9cc860" stroke="#5a8a2e" stroke-width="1.4"/><path d="M24 18c-5-6-3-12-1-13 4 2 5 8 1 13z" fill="#a8d06a" stroke="#5a8a2e" stroke-width="1.4"/><path d="M26 20c7-3 12-1 13 1-3 4-9 4-13-1z" fill="#9cc860" stroke="#5a8a2e" stroke-width="1.4"/></svg>`,

// ---- the bag illustration (back layer) ----

  <filter id="lt" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .1  0 0 0 0 .05  0 0 0 -1.2 .62" result="a"/><feComposite in="a" in2="SourceGraphic" operator="in" result="d"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="d"/></feMerge></filter>

<g filter="url(#sh)">

  <path d="M556 130 C558 46 722 46 724 130" fill="none" stroke="${ST}" stroke-width="1.6" stroke-dasharray="6 5"/>
  <rect x="530" y="112" width="40" height="34" rx="6" fill="${L3}"/><rect x="710" y="112" width="40" height="34" rx="6" fill="${L3}"/>

  <rect x="206" y="196" width="896" height="456" rx="26" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="2"/>

  <path d="M170 116 Q172 82 210 80 H1070 Q1108 82 1110 116 L1122 186 Q1124 214 1094 216 H186 Q156 214 158 186Z" fill="url(#flapG)" filter="url(#lt)"/>
  <path d="M170 116 Q172 82 210 80 H1070 Q1108 82 1110 116" fill="none" stroke="rgba(255,226,180,.35)" stroke-width="3"/>
  ${stitch('M184 96 H1096')}${stitch('M170 202 H1110')}
  <path d="M158 186 Q156 214 186 216 H1094 Q1124 214 1122 186" fill="none" stroke="${DK}" stroke-width="2.5" opacity=".6"/>
  <!-- straps -->
  <rect x="330" y="70" width="56" height="140" rx="8" fill="url(#lthD)"/>${stitch('M338 76 V204', 1.6)}${stitch('M378 76 V204', 1.6)}
  <rect x="894" y="70" width="56" height="140" rx="8" fill="url(#lthD)"/>${stitch('M902 76 V204', 1.6)}${stitch('M942 76 V204', 1.6)}
  ${buckle(358, 160)}${buckle(922, 160)}
  <!-- side pockets -->
  <g><path d="M84 470 Q82 440 112 438 L212 436 Q234 436 235 460 L238 654 Q238 684 208 686 L116 686 Q88 684 87 654Z" fill="url(#lth)" filter="url(#lt)"/>
    ${stitch('M98 476 L100 650 Q100 672 120 672 L206 672 Q224 672 224 652 L222 476')}
    <path d="M78 432 Q156 414 240 430 L242 488 Q160 504 80 488Z" fill="url(#flapG)"/>${stitch('M86 478 Q160 492 234 478', 1.6)}
    <circle cx="160" cy="484" r="7" fill="url(#brass)" stroke="#6a4416" stroke-width="1"/></g>
  <g><path d="M1196 470 Q1198 440 1168 438 L1068 436 Q1046 436 1045 460 L1042 654 Q1042 684 1072 686 L1164 686 Q1192 684 1193 654Z" fill="url(#lth)" filter="url(#lt)"/>
    ${stitch('M1182 476 L1180 650 Q1180 672 1160 672 L1074 672 Q1056 672 1056 652 L1058 476')}
    <path d="M1202 432 Q1124 414 1040 430 L1038 488 Q1120 504 1200 488Z" fill="url(#flapG)"/>${stitch('M1194 478 Q1120 492 1046 478', 1.6)}
    <circle cx="1120" cy="484" r="7" fill="url(#brass)" stroke="#6a4416" stroke-width="1"/></g>
</g>
  <!-- rolled map in right pocket -->
  <g transform="translate(1166 318) rotate(14)"><rect x="-22" y="0" width="44" height="150" rx="8" fill="#f6e8c8" stroke="#a8844e" stroke-width="1.4"/>

    <rect x="-24" y="70" width="48" height="10" rx="3" fill="#a0603a"/></g>

  <linearGradient id="rollShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>

  <!-- flowers in left pocket -->

  <path d="M112 420c-14-4-20-14-18-18 10 0 18 8 18 18zM150 418c10-10 22-10 24-7-6 8-16 10-24 7z" fill="#8cc058" stroke="#4a7a26" stroke-width="1.2"/>
  ${daisy(96, 368, 22, -15)}${daisy(160, 366, 18, 20)}${daisy(128, 390, 14, 5)}
  <!-- bedroll -->
  <g><rect x="296" y="652" width="250" height="60" rx="30" fill="url(#plaid)" stroke="#3e6a20" stroke-width="2"/>
    <rect x="296" y="652" width="250" height="60" rx="30" fill="url(#rollShade)"/>
    <ellipse cx="516" cy="682" rx="18" ry="29" fill="#8cba58" stroke="#3e6a20" stroke-width="2"/><path d="M516 662 q-11 8 -4 20 q7 11 -2 17" stroke="#4e7a2c" stroke-width="2" fill="none"/>
    <rect x="350" y="646" width="22" height="72" rx="5" fill="#7a4424" stroke="#4a2612" stroke-width="1.4"/><rect x="462" y="646" width="22" height="72" rx="5" fill="#7a4424" stroke="#4a2612" stroke-width="1.4"/></g>
  <!-- compass hanging from the foot bar -->
  <g transform="translate(766 668)"><path d="M0 -60 V-36" stroke="#a87a3a" stroke-width="4"/><circle cx="0" cy="-64" r="7" fill="none" stroke="url(#brass)" stroke-width="4"/>
    <circle r="36" fill="url(#brass)" stroke="#6a4416" stroke-width="1.5"/><circle r="28" fill="url(#face)" stroke="#9a6418" stroke-width="1.5"/>
    ${[0, 90, 180, 270].map(a => `<path d="M0 -26 V-21" stroke="#8a6a40" stroke-width="2" transform="rotate(${a})"/>`).join('')}
    <g transform="rotate(32)"><path d="M0 -22 L5 0 L0 3 L-5 0Z" fill="#e0533f"/><path d="M0 22 L5 0 L0 -3 L-5 0Z" fill="#3a6ab0"/><circle r="3" fill="#6a4416"/></g>
    <ellipse cx="-10" cy="-12" rx="8" ry="4" fill="#fff" opacity=".6" transform="rotate(-35 -10 -12)"/></g>
  <!-- brass ring left -->
  <circle cx="196" cy="644" r="16" fill="none" stroke="url(#brass)" stroke-width="5"/><rect x="188" y="618" width="16" height="12" rx="3" fill="#6a3a1e"/>
  <!-- mountain patch right -->
  <g transform="translate(1150 622) rotate(-12)"><rect x="-38" y="-28" width="76" height="56" rx="10" fill="#efe2c2" stroke="#8a6a40" stroke-width="1.6"/>
    <rect x="-32" y="-22" width="64" height="44" rx="7" fill="none" stroke="#b09060" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M-24 14 L-8 -8 L2 4 L10 -4 L24 14Z" fill="#7aa84a" stroke="#4a7a26" stroke-width="1.4" stroke-linejoin="round"/><circle cx="14" cy="-10" r="4" fill="#f0b844"/></g>
</svg>`
const html = `
<div class="abs ident" style="left:16px;top:12px"><div class="ring"><span class="wx" style="display:block">${WX.clear}</span></div>
  <div class="glass bar"><b>Tiny Planet</b><div class="sub"><span class="wx" style="display:block">${WX.clear}</span>Day 3 · 15:20</div><span class="nrg"><i style="width:72%"></i></span></div></div>
<div class="abs" style="right:18px;top:14px;display:flex;gap:12px">
  <div class="glass sqbtn">${gl('bag')}<span class="dot n">3</span><span class="kc">B</span></div><div class="glass sqbtn">${gl('recipes')}<span class="kc">C</span></div>
  <div class="glass sqbtn">${gl('journal')}<span class="dot"></span><span class="kc">J</span></div><div class="glass sqbtn">${gl('gear')}<span class="kc">Esc</span></div></div>
