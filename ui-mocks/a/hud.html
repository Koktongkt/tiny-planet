<!doctype html>
<html><head><meta charset="utf-8"><title>Option A HUD</title>
<link rel="stylesheet" href="glass.css">
<script src="../icons.js"></script><script src="glyphs.js"></script>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.abs{position:absolute}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(16,12,16,.3),rgba(16,12,16,.66))}
</style></head>
<body class="ui"><img id="bg"><div id="root"></div>
<script>
const q = new URLSearchParams(location.search)
const T = q.get('t') || 'day', IN = q.get('in') || 'desk', SC = q.get('scene') || 'hud'
const WXK = q.get('wx') || (T === 'night' ? 'nightcloudy' : 'clear')
const WXNAME = { clear: 'Sunny', breezy: 'Breezy', cloudy: 'Cloudy', drizzle: 'Drizzle', rain: 'Rain', night: 'Clear night', nightcloudy: 'Cloudy night', nightrain: 'Rainy night' }
document.getElementById('bg').src = T === 'night' ? 't-night.jpg' : 't-out2.jpg'
const it = (id) => `<span class="it">${IC[id + '_nw']}</span>`
const gl = (id, cls = 'gl') => `<span class="${cls}">${GL[id]}</span>`
const desk = IN === 'desk'
const kc = (k) => desk ? `<span class="kc">${k}</span>` : ''
const time = T === 'night' ? '21:40' : '15:20'
const ident = `<div class="abs ident" style="left:16px;top:12px">
  <div class="ring"><span class="wx" style="display:block">${WX[WXK]}</span></div>
  <div class="glass bar"><b>Tiny Planet</b><div class="sub"><span class="wx" style="display:block">${WX[T === 'night' ? 'night' : 'clear']}</span>Day 3 · ${time}</div><span class="nrg"><i style="width:72%"></i></span></div></div>`
const topR = `<div class="abs" style="right:18px;top:14px;display:flex;align-items:center;gap:12px">
  <div class="glass sqbtn">${gl('bag')}<span class="dot n">3</span>${kc('B')}</div>
  <div class="glass sqbtn">${gl('recipes')}${kc('C')}</div>
  <div class="glass sqbtn">${gl('journal')}<span class="dot"></span>${kc('J')}</div>
  <div class="glass sqbtn">${gl('gear')}${kc('Esc')}</div></div>`
let h = ''
if (SC === 'hud') {
  h = ident + topR + `
  <div class="abs glass fade quest" style="left:16px;top:104px"><h4><span class="scroll">${GL.scroll}</span>A Cozy Home</h4><ul>
    <li class="done"><span>Gather 5 wood</span><em>5/5</em></li>
    <li><span>Craft a Moss Lamp</span><em>0/1</em></li>
    <li class="todo"><span>Place it in your house</span><em>0/1</em></li></ul></div>
  <div class="abs ring mini" style="right:24px;top:84px"><div class="map" style="background:url(globe-${T === 'night' ? 'night' : 'day'}.jpg) -16px -18px/192px auto"></div>
    <span class="me">${GL.me}</span><span class="n">N</span></div>
  <div class="abs glass sqbtn" style="right:24px;top:262px;width:42px;height:42px;border-radius:12px">${gl('camera').replace('class="gl"', 'class="gl" style="width:26px;height:26px"')}${kc('P')}</div>
  <div class="abs glass pill toast" style="left:50%;top:84px;transform:translateX(-50%)">${it('wood')}<span>Gathered <b>Wood</b></span><span class="plusn">+3</span></div>
  <div class="abs glass pill prompt" style="left:50%;bottom:${desk ? 128 : 124}px;transform:translateX(-50%)">
    ${desk ? '<span class="key">E</span>' : `<span class="gl" style="width:28px;height:28px;margin-left:4px">${GL.hand}</span>`}<span>Gather <b>Wild Berries</b></span>
    <span class="sep"></span>${desk ? '<span class="key" style="width:28px;height:28px;font-size:14px">F</span>' : ''}<span class="alt">Taste one</span></div>
  <div class="abs hotbar" style="left:50%;bottom:22px;transform:translateX(-50%)">
    <span class="chev">${GL.chevL}</span>
    ${[['rod'], ['can'], ['lantern'], ['berries', 12], ['wood', 24], ['seedpack', 6]].map(([id, n], i) => `<div class="slot${i === 0 ? ' sel' : ''}">${it(id)}${n ? `<span class="ct">${n}</span>` : ''}<span class="num">${i + 1}</span></div>`).join('')}
    <span class="chev">${GL.chevR}</span></div>
  <div class="abs rbtn" style="right:${desk ? 64 : 70}px;bottom:${desk ? 178 : 190}px;width:${desk ? 84 : 96}px;height:${desk ? 84 : 96}px">${gl('hand')}${kc('E')}</div>
  <div class="abs rbtn" style="right:${desk ? 136 : 152}px;bottom:${desk ? 68 : 66}px;width:${desk ? 64 : 76}px;height:${desk ? 64 : 76}px">${gl('run')}${kc('Shift')}</div>
  <div class="abs rbtn" style="right:${desk ? 40 : 40}px;bottom:${desk ? 68 : 66}px;width:${desk ? 64 : 76}px;height:${desk ? 64 : 76}px">${gl('jump')}${kc('Space')}</div>
  ${desk ? '' : `<div class="abs stick" style="left:44px;bottom:56px"><div class="knob"></div>
    ${[[0, 'left:50%;top:8px;transform:translateX(-50%)'], [180, 'left:50%;bottom:8px;transform:translateX(-50%) rotate(180deg)'], [270, 'left:8px;top:50%;transform:translateY(-50%) rotate(-90deg)'], [90, 'right:8px;top:50%;transform:translateY(-50%) rotate(90deg)']].map(([, s]) => `<span class="ar" style="${s}">${GL.arrow}</span>`).join('')}</div>`}`
} else {
  const items = [['mushroom', 3], ['flower', 5, 1], ['berries', 12], ['wood', 24], ['stone', 4], ['shell', 2], ['herbs', 6], ['acorn', 3], ['fish', 1], ['crystal', 2], ['moss', 7], ['pinecone', 4], [null], [null], [null]]
  h = ident + topR + `<div class="veil"></div>
  <div class="abs panel" style="left:50%;top:54%;transform:translate(-50%,-50%);width:860px;height:540px">
    <div class="ptitle">${it('bag')}Bag</div>
    <div class="rbtn xbtn">${gl('close')}</div>
    <div class="tabs abs" style="left:26px;top:44px"><div class="tab on">Gathered <i>12</i></div><div class="tab">Tools <i>4</i></div><div class="tab">Food <i>3</i></div><div class="tab">Decor <i>1</i></div></div>
    <div class="abs" style="left:26px;top:100px;display:grid;grid-template-columns:repeat(5,88px);gap:12px">
      ${items.map(([id, n, sel]) => id ? `<div class="cell${sel ? ' sel' : ''}">${it(id)}<span class="ct">${n}</span>${id === 'flower' ? '<span class="star">✦</span>' : ''}</div>` : '<div class="cell empty"></div>').join('')}</div>
    <div class="abs" style="right:24px;top:44px;bottom:66px;width:276px;border-radius:18px;background:rgba(0,0,0,.24);border:1px solid var(--g-rim-soft);padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center">
      <div style="width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,214,140,.38),rgba(255,214,140,0) 70%)"><span class="it" style="width:108px;height:108px">${IC.flower_nw}</span></div>
      <div style="font-size:24px;font-weight:600;margin-top:6px">Wild Flower</div>
      <div style="font-size:12px;font-weight:600;letter-spacing:1.2px;color:var(--t-gold);margin-top:2px">GATHERED · ✦ PERFECT</div>
      <p style="font-size:15px;line-height:1.45;color:var(--t2);margin:12px 0 0">A little pink bloom from the meadow. Grandma says they brighten any windowsill.</p>
      <div style="margin-top:auto;display:flex;gap:10px;width:100%"><span class="btn green" style="flex:1;padding:0">Craft with</span><span class="btn" style="flex:1;padding:0">Gift</span></div></div>
    <div class="abs" style="left:26px;right:24px;bottom:22px;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--t2)">
      <span>14 / 57 discovered</span><span class="meter" style="flex:0 0 220px"><i style="width:24%"></i></span><span style="flex:1"></span><span class="btn ghost" style="height:34px;font-size:14px;padding:0 16px">Reset save</span></div>
  </div>`
}
document.getElementById('root').innerHTML = h
</script></body></html>
