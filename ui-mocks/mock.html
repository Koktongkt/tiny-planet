<div id="root"></div>
<script>
const q=new URLSearchParams(location.search),S=q.get('s')||'A',SC=q.get('scene')||'hud'
document.getElementById('bg').src=SC==='bag'?'bg-in.jpg':'bg-out.jpg'

document.body.insertAdjacentHTML('afterbegin',IC.defs)
const G={hand:'<svg class="g" viewBox="0 0 40 40" fill="none" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21V10.5a2.2 2.2 0 0 1 4.4 0V19M17.4 18V8a2.2 2.2 0 0 1 4.4 0v10M21.8 18V9.5a2.2 2.2 0 0 1 4.4 0V20M26.2 20v-6a2.2 2.2 0 0 1 4.4 0v10c0 6-4 10-10 10h-1c-4 0-6-2-8.5-5.5L7 23a2.2 2.2 0 0 1 3.6-2.6L13 23"/></svg>',
run:'<svg class="g" viewBox="0 0 40 40" fill="none" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="7.5" r="3.2" fill="#fffaf0"/><path d="M12 15l7-3 5 4 4 5 5 1M19 12l-3 10 6 4-2 9M16 22l-5 6H6"/></svg>',
up:'<svg class="g" viewBox="0 0 40 40" fill="#fffaf0"><path d="M20 5l12 13h-7v15h-10V18H8z"/></svg>'}

let h=''
if(S==='A'){
 if(SC==='hud'){h=`
 <div class="abs rim badge">${ic('leaf',false)}</div>
 <div class="abs glass ident"><b class="ts">Tiny Planet</b><div class="row sub ts">${ic('sun',false)}Day 1 · 13:20</div><span class="nrg"><i></i></span></div>
 <div class="abs glass quest"><h4 class="row ts"><span class="scroll">${ic('board',false)}</span>Settle In</h4><ul>
  <li class="ts"><span>Pick something pretty</span><em>0/1</em></li><li class="ts dim"><span>Say hello to a neighbour</span><em>0/1</em></li></ul></div>
 <div class="abs row top">
  <div class="glass row cur"><span class="coin ic">${IC.coin_nw}</span><span class="ts">2,540</span><span class="plus">+</span></div>
  <div class="rim rbtn">${ic('bag',false)}<span class="dot">3</span><span class="k">B</span></div>
  <div class="rim rbtn">${ic('book',false)}<span class="k">C</span></div>
  <div class="rim rbtn">${ic('board',false)}<span class="dot"></span><span class="k">J</span></div>
  <div class="rim rbtn">${ic('gear',false)}</div></div>
 <div class="abs rim mapw"><div class="map"></div><div class="me"></div><div class="rim n">N</div></div>
 <div class="abs glass row toast">${ic('mushroom',false)}<span class="ts">Found a <b>Mushroom</b> · ×3</span></div>
 <div class="abs glass row prompt"><span class="key">E</span><span class="ts">Gather <b>Wild Flower</b></span><span class="sep"></span><span class="key" style="width:32px;height:32px;font-size:15px">F</span><span class="ts" style="font-size:17px;opacity:.9">Smell it</span></div>
 <div class="abs row hotbar"><span class="chev">‹</span>
  ${[['rod'],['can'],['lantern'],['bike'],['onigiri',2],['wood',12]].map(([id,n],i)=>`<div class="slot${i===0?' sel':''}">${ic(id,false)}${n?`<span class="ct">${n}</span>`:''}<span class="num">${i+1}</span></div>`).join('')}

  <div class="rim act big">${G.hand.replace('class="g"','class="g" style="width:52px;height:52px"')}<span class="k">E · Gather</span></div>
  <div class="rim act sm" style="left:30px;top:118px">${G.run}<span class="k">Shift</span></div>
  <div class="rim act sm" style="left:140px;top:118px">${G.up}<span class="k">Space</span></div></div>`}
 else {h=`<div class="veil"></div>
 <div class="abs row top" style="opacity:.55">
  <div class="rim rbtn">${ic('bag',false)}</div><div class="rim rbtn">${ic('book',false)}</div><div class="rim rbtn">${ic('board',false)}</div><div class="rim rbtn">${ic('gear',false)}</div></div>
 <div class="abs glass panel">
  <div class="row ph">${ic('bag',false)}Bag</div><div class="rim px">✕</div>
  <div class="row tabs"><div class="tab on">Gathered <i>12</i></div><div class="tab">Tools <i>4</i></div><div class="tab">Food <i>3</i></div><div class="tab">Decor <i>1</i></div></div>

  <div class="detail"><div class="big">${ic('flower',false)}</div><h5>Wild Flower</h5><div class="tg">Gathered · ✦ perfect</div>
   <p>A little pink bloom from the meadow. Grandma says they brighten any windowsill.</p>
   <div class="row btns"><div class="gbtn alt">Craft with</div><div class="gbtn">Gift</div></div></div>
  <div class="row pf"><span>14 / 57 discovered</span><span class="bar"><i></i></span><span class="sp"></span><span class="lnk">Reset save</span></div>
 </div>`}
} else {
 if(SC==='hud'){h=`
 <div class="abs card row title">${ic('leaf')}Tiny Planet</div>
 <div class="abs card quest"><h4 class="row">${ic('board',false)}Settle In<span class="car">▼</span></h4><ul>
  <li class="done"><span class="cb on">✓</span><span>Stretch your legs</span></li>

 <div class="abs card row toast">${ic('mushroom',false)}<span>Found a <b>Mushroom</b> · ×3</span></div>
 <div class="abs card mapc"><div class="m"><span class="pin"></span><span class="nn">↑N</span><div class="zm">+<br>−</div></div></div>

  <div class="card bt">${ic('bag',false)}Bag<span class="k">B</span><span class="dot">3</span></div>
  <div class="card bt">${ic('book',false)}Recipes<span class="k">C</span></div>
  <div class="card bt">${ic('board',false)}Journal<span class="k">J</span></div>
  <div class="card bt">${ic('gear',false)}Settings</div>
  <div class="card bt">${ic('sun',false)}Photo<span class="k">P</span></div></div>`}
 else {h=`<div class="veil"></div>
 <div class="abs card panel">
  <div class="row ph">${ic('bag')}Bag</div><div class="px">✕</div>
  <div class="row tabs"><div class="tab on">Gathered <i>12</i></div><div class="tab">Tools <i>4</i></div><div class="tab">Food <i>3</i></div><div class="tab">Decor <i>1</i></div></div>

  <div class="detail"><div class="big">${ic('flower')}</div><h5>Wild Flower</h5><div class="tg">Gathered · ✦ perfect</div>
   <p>A little pink bloom from the meadow. Grandma says they brighten any windowsill.</p>
   <div class="row btns2"><div class="gbtn alt">Craft with</div><div class="gbtn">Gift</div></div></div>
  <div class="row pf"><span>14 / 57 discovered</span><span class="bar"><i></i></span><span class="sp"></span><span class="lnk">Reset save</span></div>
 </div>`}
}
const r=document.getElementById('root');r.className=S;r.innerHTML=h
</script></body></html>
