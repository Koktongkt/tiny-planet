<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Motion Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap">
<style>
/* Layout: a slim control bar over a full-height stage; side by side splits the stage into Before | After views. Single sunlit-meadow look in both themes. */
:root { --paper: #fbf3e6; --ink: #3b2c22; --muted: #7a6656; --line: #e3d3bd; --accent: #d9655b; --leaf: #6e8f4e; --chip: #f3e6d2;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; --body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color-scheme: light }
html, body { height: 100%; margin: 0 }
body { background: var(--paper); color: var(--ink); font: 14px/1.4 var(--body); overflow: hidden; display: flex; flex-direction: column;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)) }
#root { flex: 1; display: flex; flex-direction: column; min-height: 0 }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--paper) }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px }
.brand h1 { font: 600 20px/1.1 var(--display); margin: 0; letter-spacing: 0.01em; text-wrap: balance }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px }
.toggle { display: none }
.controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 14px; flex: 100 1 auto }
.seg, .pick { display: flex; flex-direction: column; gap: 3px }
.seg-l, .pick span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted) }
.seg-o { display: flex; background: var(--chip); border-radius: 9px; padding: 2px }
button, select { font: 600 13px/1 var(--body); color: var(--ink) }
.seg-o button { border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap }
.seg-o button.on { background: #fff; box-shadow: 0 1px 2px rgba(59, 44, 34, 0.18) }
select { padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: #fff }
.reset, .toggle { border: 1px solid var(--accent); color: var(--accent); background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.stage { flex: 1; display: grid; min-height: 0 }
.stage.n2 { grid-template-columns: 1fr 1fr; gap: 2px; background: var(--line) }
.view { position: relative; min-width: 0; min-height: 0; background: #eaf1dc }
.view canvas { touch-action: none }
.tag { position: absolute; top: 10px; left: 10px; font: 600 13px/1 var(--display); padding: 6px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); pointer-events: none }
.tag.new { color: var(--leaf) } .tag.old { color: var(--muted) }
.readout { position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); background: rgba(255, 255, 255, 0.78); padding: 5px 8px; border-radius: 7px; pointer-events: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.legend { padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: var(--muted); border-top: 1px solid var(--line) }
@media (max-width: 720px) {
  .stage.n2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr }
  .toggle { display: inline-block }
  .brand p { display: none }
  .legend { display: none }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
</style></head><body><div id="root"></div>
<script type="module" src="/src/art/motionStudio.jsx"></script></body></html>
