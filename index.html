#lit,#lha{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 2.2s ease}#lit{mix-blend-mode:multiply}#lha{mix-blend-mode:screen}
#ld.lit #lit,#ld.lit #lha{opacity:1;animation:fk 4.2s ease-in-out 2.2s infinite}#lit{fill:#ffc04f}#lha{fill:url(#wg)}
@keyframes fk{0%,100%{opacity:1}30%{opacity:.82}36%{opacity:.95}62%{opacity:.86}}
#pi{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.94);transition:opacity 1.4s ease,transform 1.8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 18px 28px #3e5f9640)}#pi.in{opacity:1;transform:none}
/* title card */
#tx{position:relative;flex:0 1 auto;width:min(36vw,480px);text-align:center;transition:opacity 1.2s,transform 2s}
#tt h1{position:relative;margin:0;font-weight:600;font-size:clamp(54px,7.4vw,128px);line-height:.92;letter-spacing:-.01em;text-shadow:0 2px 0 #d9e6f8,0 6px 26px #4d77b455}
#tt h1 span{display:block}#tt h1 span:first-child{position:relative;display:inline-block}#tt .sp{position:absolute;left:.02em;top:-.5em;width:.56em;height:.48em}
#tt .sw{display:block;width:56%;height:auto;margin:.2em auto 0;overflow:visible}
#tt p{margin:.9em 0 0;font-size:clamp(17px,1.6vw,26px);line-height:1.35;font-weight:400;letter-spacing:.01em;opacity:.95;text-shadow:0 1px 10px #4d77b455}
#ft,#go{margin-top:clamp(26px,4.5vh,56px)}
#ft{transition:opacity .8s}
#bar{position:relative;height:clamp(14px,1.5vw,22px);border:2.5px solid #fff;border-radius:99px;overflow:hidden;box-shadow:0 2px 14px #4d77b433;background:#ffffff1f}
#fill{position:absolute;inset:2px;border-radius:99px;background:linear-gradient(#ffe7a8,#f5cf7e);transform-origin:0 50%;transform:scaleX(0);transition:transform .5s ease-out}
#st{display:block;margin-top:.9em;font-size:clamp(15px,1.3vw,20px);letter-spacing:.12em;opacity:.92;transition:opacity .6s}
#tip{display:block;margin:.7em auto 0;max-width:30em;font-size:clamp(14px,1.15vw,18px);font-weight:400;letter-spacing:.01em;opacity:.92;transition:opacity .8s;min-height:2.6em;text-shadow:0 1px 8px #4d77b466;text-wrap:balance}#tip.h{opacity:0}
#go{position:absolute;left:50%;bottom:0;transform:translate(-50%,10px);opacity:0;pointer-events:none;font:inherit;font-size:clamp(20px,1.8vw,28px);color:#7a4a2e;background:linear-gradient(#fff8e6,#ffe7b4);border:0;border-radius:99px;padding:.55em 1.6em .6em;white-space:nowrap;cursor:pointer;box-shadow:0 4px 0 #e5b979,0 10px 26px #3e5f9640;transition:opacity 1.2s,transform 1.2s}
